services:
  backend:
    build:
      context: ./backend
    image: property-listing-enhancer-backend
    environment:
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is not set}
      HF_THINKING_MODEL_REPO: ${HF_THINKING_MODEL_REPO:-Qwen/Qwen3-8B}
      HF_THINKING_MODEL_PROVIDER_NAME: ${HF_THINKING_MODEL_PROVIDER_NAME:-featherless-ai}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-1024}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
    image: property-listing-enhancer-frontend
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
